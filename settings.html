<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuroCat Settings</title>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; font-size: 14px; }
      * { box-sizing: border-box; }
      body { margin: 0; display: flex; height: 100vh; }
      nav { width: 150px; padding: 12px 8px; border-right: 1px solid #8884; display: flex; flex-direction: column; gap: 4px; flex: none; }
      nav button { text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; cursor: pointer; }
      nav button[aria-selected="true"] { background: #7a7aff33; font-weight: 600; }
      main { flex: 1; padding: 16px 22px; overflow: auto; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      h2 { font-size: 14px; margin: 18px 0 6px; }
      p.desc { margin: 0 0 12px; opacity: .72; line-height: 1.5; }
      .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
      .row > label { min-width: 190px; }
      input[type=number] { width: 90px; }
      input[type=text], textarea, select { min-width: 160px; }
      input, select, button, textarea { font: inherit; }
      button.btn { padding: 5px 14px; border-radius: 6px; border: 1px solid #8886; background: #7a7aff33; color: inherit; cursor: pointer; }
      button.btn:disabled { opacity: .45; cursor: default; }
      button.danger { background: #ff5a5a33; }
      .card { border: 1px solid #8884; border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
      .card.welcome { border-color: #7a7aff; background: #7a7aff14; }
      .status { opacity: .85; margin: 8px 0; }
      .toast { position: fixed; right: 16px; bottom: 12px; padding: 6px 12px; border-radius: 8px; background: #2b6e3fcc; color: #fff; opacity: 0; transition: opacity .2s; pointer-events: none; }
      .toast.show { opacity: 1; }
      .toast.err { background: #a33; }
      .days label { margin-right: 6px; min-width: 0; }
      .muted { opacity: .6; }
    </style>
  </head>
  <body>
    <nav id="tabs" role="tablist"></nav>
    <main id="panel" role="tabpanel"></main>
    <div id="toast" class="toast"></div>
    <script type="module" src="/src/settingsMain.ts"></script>
  </body>
</html>
